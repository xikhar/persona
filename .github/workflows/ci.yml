name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Windows x64
            runner: windows-latest
          - name: macOS arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test runtime and renderer behavior
        run: npm test

      - name: Validate the asset contract
        run: npm run assets:check

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Compile the native listener
        run: npm run native:build

      - name: Run the native listener self-test
        run: npm run native:test

      - name: Build the renderer
        run: npm run build
